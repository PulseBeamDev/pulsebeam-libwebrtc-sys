name: WebRTC upgrade check

on:
  workflow_dispatch:
    inputs:
      webrtc_commit:
        description: Candidate 40-character webrtc-sdk/webrtc commit
        required: true
        type: string

permissions: {}

jobs:
  source-pin-adapter-check:
    name: Candidate adapter build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: 1.43.1
      - name: Prove rootless Podman is available
        run: |
          command -v podman
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - name: Select the candidate source pin
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.webrtc_commit }}
        run: |
          just linux-image pulsebeam-linux-${{ github.sha }}
          just linux-run pulsebeam-linux-${{ github.sha }} bash -c '
            candidate=$1
            [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || { echo "candidate must be a lowercase 40-character commit" >&2; exit 1; }
            current=$(sed -n "s/^webrtc_commit := \"\\([0-9a-f]\\{40\\}\)\"$/\\1/p" Justfile)
            test -n "$current" && test "$current" != "$candidate" || { echo "candidate must differ from the checked-in pin" >&2; exit 1; }
            sed -i "s/$current/$candidate/" Justfile
          ' -- "$CANDIDATE_COMMIT"
      - name: Verify the pinned CXX import refresh is mechanical
        run: |
          just linux-run pulsebeam-linux-${{ github.sha }} just refresh-cxx
          just linux-run pulsebeam-linux-${{ github.sha }} git diff --exit-code -- vendor/cxx Cargo.toml Cargo.lock
      - name: Build candidate adapter
        shell: bash
        run: just linux-run pulsebeam-linux-${{ github.sha }} just build core linux-x86_64
      - name: Save adapter failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-rehearsal-failure-log
          path: upgrade-rehearsal.log
          if-no-files-found: warn
          retention-days: 14
