name: Manual attested release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag (m<milestone>-r<revision>)
        required: true
        type: string
      recipe_commit:
        description: Exact reviewed repository commit
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: 1.43.1
      - name: Validate immutable dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${{ github.sha }}" = "${{ inputs.recipe_commit }}" || {
            echo 'Dispatched branch moved after operator validation; dispatch the reviewed commit again.' >&2
            exit 1
          }
          just release-dry-run '${{ inputs.tag }}'
          just _validate-release-remote '${{ inputs.tag }}'
      - id: matrix
        name: Load matrix from Justfile
        run: echo "matrix=$(just release-matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: 1.43.1
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
      - name: Reclaim expendable runner software and check capacity
        shell: bash
        run: just ci-reclaim '${{ matrix.target }}'
      - name: Prepare platform verification
        if: matrix.target == 'ios-simulator-arm64' && matrix.flavor == 'native'
        shell: bash
        run: just ci-prepare '${{ matrix.target }}'
      - name: Build and verify packaged artifact
        if: matrix.target != 'android-x86_64' || matrix.flavor != 'native'
        shell: bash
        run: just '${{ matrix.flavor }}' '${{ matrix.target }}'
      - name: Build and verify Android package on emulator
        if: matrix.target == 'android-x86_64' && matrix.flavor == 'native'
        uses: reactivecircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          disk-size: 4096M
          script: just native android-x86_64
      - id: assets
        name: Resolve verified assets
        shell: bash
        run: |
          {
            echo 'paths<<PULSEBEAM_ASSETS'
            just release-job-assets '${{ matrix.target }}' '${{ matrix.flavor }}' '${{ inputs.tag }}' | sed 's#^#dist/#'
            echo PULSEBEAM_ASSETS
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.flavor }}-${{ matrix.target }}
          path: ${{ steps.assets.outputs.paths }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: 1.43.1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: incoming
          merge-multiple: true
      - name: Revalidate and stage the complete release
        run: just stage-release '${{ inputs.tag }}' incoming release
      - id: provenance
        name: Attest every release subject
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/*
      - name: Create, verify, and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: just publish-release '${{ inputs.tag }}' release '${{ steps.provenance.outputs.bundle-path }}'
