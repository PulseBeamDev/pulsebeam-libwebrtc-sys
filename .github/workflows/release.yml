name: Manual pulsebeam-webrtc-sys release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag that resolves to this workflow commit
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tagged workflow commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo 'invalid tag' >&2; exit 1; }
          tagged=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}") || { echo 'tag does not exist' >&2; exit 1; }
          test "$tagged" = "$WORKFLOW_COMMIT" || { echo 'tag does not resolve to the workflow commit' >&2; exit 1; }

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: core
            target: linux-x86_64
            runner: ubuntu-24.04
          - flavor: core
            target: linux-arm64
            runner: ubuntu-24.04
          - flavor: core
            target: windows-x86_64
            runner: windows-2025
          - flavor: core
            target: macos-x86_64
            runner: macos-15-intel
          - flavor: core
            target: macos-arm64
            runner: macos-15
          - flavor: core
            target: android-x86_64
            runner: ubuntu-24.04
          - flavor: core
            target: android-arm64-v8a
            runner: ubuntu-24.04
          - flavor: core
            target: ios-arm64
            runner: macos-15
          - flavor: core
            target: ios-simulator-arm64
            runner: macos-15
          - flavor: native
            target: linux-x86_64
            runner: ubuntu-24.04
          - flavor: native
            target: linux-arm64
            runner: ubuntu-24.04
          - flavor: native
            target: windows-x86_64
            runner: windows-2025
          - flavor: native
            target: macos-x86_64
            runner: macos-15-intel
          - flavor: native
            target: macos-arm64
            runner: macos-15
          - flavor: native
            target: android-x86_64
            runner: ubuntu-24.04
          - flavor: native
            target: android-arm64-v8a
            runner: ubuntu-24.04
          - flavor: native
            target: ios-arm64
            runner: macos-15
          - flavor: native
            target: ios-simulator-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: 1.43.1
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
      - name: Install Rust target for artifact link smoke
        shell: bash
        run: |
          case '${{ matrix.target }}' in
            linux-x86_64) cargo_target=x86_64-unknown-linux-gnu ;;
            linux-arm64) cargo_target=aarch64-unknown-linux-gnu ;;
            windows-x86_64) cargo_target=x86_64-pc-windows-msvc ;;
            macos-x86_64) cargo_target=x86_64-apple-darwin ;;
            macos-arm64) cargo_target=aarch64-apple-darwin ;;
            android-x86_64) cargo_target=x86_64-linux-android ;;
            android-arm64-v8a) cargo_target=aarch64-linux-android ;;
            ios-arm64) cargo_target=aarch64-apple-ios ;;
            ios-simulator-arm64) cargo_target=aarch64-apple-ios-sim ;;
          esac
          rustup target add "$cargo_target"
      - name: Reclaim known expendable Linux runner caches
        if: runner.os == 'Linux'
        shell: bash
        run: sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: Build native artifact
        shell: bash
        run: just build '${{ matrix.flavor }}' '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.flavor }}-${{ matrix.target }}
          path: dist/webrtc-${{ matrix.flavor }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: release
          merge-multiple: true
      - name: Generate release checksum index
        shell: bash
        working-directory: release
        run: |
          test "$(find . -maxdepth 1 -name 'webrtc-*.tar.gz' | wc -l)" -eq 18
          find . -maxdepth 1 -name 'webrtc-*.tar.gz' -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
      - name: Generate release-ready consumer lock
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 tools/write_artifact_lock.py --tag "$RELEASE_TAG" --checksums release/SHA256SUMS --output release/artifacts.lock.json
      - name: Attest final release assets
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "$RELEASE_TAG" --generate-notes
