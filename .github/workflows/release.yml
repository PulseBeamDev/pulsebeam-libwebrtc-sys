name: Complete-matrix checks (manual)
on:
  workflow_dispatch:
permissions: {}
jobs:
  linux-build:
    name: Build (${{ matrix.flavor }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {flavor: core, target: linux-x86_64, runner: ubuntu-24.04}
          - {flavor: core, target: linux-arm64, runner: ubuntu-24.04-arm}
          - {flavor: native, target: linux-x86_64, runner: ubuntu-24.04}
          - {flavor: native, target: linux-arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with: {just-version: 1.43.1}
      - name: Prove rootless Podman is available
        run: |
          command -v podman
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - name: Restore compiler object cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .work/sccache/${{ matrix.target }}
          key: linux-sccache-v1-${{ matrix.target }}-${{ github.sha }}
          restore-keys: linux-sccache-v1-${{ matrix.target }}-
      - run: just linux-image pulsebeam-linux-${{ github.sha }}
      - name: Prepare ARM64 checkout for toolchain restore
        if: matrix.target == 'linux-arm64'
        run: just linux-run pulsebeam-linux-${{ github.sha }} just _sync '${{ matrix.flavor }}' '${{ matrix.target }}'
      - name: Restore pinned ARM64 Chromium LLVM toolchain
        if: matrix.target == 'linux-arm64'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .work/checkout/src/third_party/llvm-build/Release+Asserts
          key: linux-arm64-llvm-v1-${{ hashFiles('Justfile', 'Containerfile') }}
      - name: Build and smoke-link artifact
        run: just linux-run pulsebeam-linux-${{ github.sha }} just build '${{ matrix.flavor }}' '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: '${{ matrix.flavor }}-${{ matrix.target }}', path: 'dist/webrtc-${{ matrix.flavor }}-${{ matrix.target }}.tar.gz', if-no-files-found: error, retention-days: 1, compression-level: 0}
  non-linux-build:
    name: Build (${{ matrix.flavor }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {flavor: core, target: windows-x86_64, runner: windows-2025}
          - {flavor: core, target: macos-x86_64, runner: macos-15-intel}
          - {flavor: core, target: macos-arm64, runner: macos-15}
          - {flavor: core, target: android-x86_64, runner: ubuntu-24.04}
          - {flavor: core, target: android-arm64-v8a, runner: ubuntu-24.04}
          - {flavor: core, target: ios-arm64, runner: macos-15}
          - {flavor: core, target: ios-simulator-arm64, runner: macos-15}
          - {flavor: native, target: windows-x86_64, runner: windows-2025}
          - {flavor: native, target: macos-x86_64, runner: macos-15-intel}
          - {flavor: native, target: macos-arm64, runner: macos-15}
          - {flavor: native, target: android-x86_64, runner: ubuntu-24.04}
          - {flavor: native, target: android-arm64-v8a, runner: ubuntu-24.04}
          - {flavor: native, target: ios-arm64, runner: macos-15}
          - {flavor: native, target: ios-simulator-arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with: {just-version: 1.43.1}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
      - name: Install Rust target for artifact link smoke
        shell: bash
        run: |
          case '${{ matrix.target }}' in
            windows-x86_64) cargo_target=x86_64-pc-windows-msvc ;;
            macos-x86_64) cargo_target=x86_64-apple-darwin ;;
            macos-arm64) cargo_target=aarch64-apple-darwin ;;
            android-x86_64) cargo_target=x86_64-linux-android ;;
            android-arm64-v8a) cargo_target=aarch64-linux-android ;;
            ios-arm64) cargo_target=aarch64-apple-ios ;;
            ios-simulator-arm64) cargo_target=aarch64-apple-ios-sim ;;
          esac
          rustup target add "$cargo_target"
      - name: Build and smoke-link artifact
        run: just build '${{ matrix.flavor }}' '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: '${{ matrix.flavor }}-${{ matrix.target }}', path: 'dist/webrtc-${{ matrix.flavor }}-${{ matrix.target }}.tar.gz', if-no-files-found: error, retention-days: 1, compression-level: 0}
  linux-desktop-runtime:
    name: Runtime (${{ matrix.flavor }}, linux-x86_64)
    needs: linux-build
    strategy: {fail-fast: false, matrix: {flavor: [core, native]}}
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with: {just-version: 1.43.1}
      - name: Prove rootless Podman is available
        run: |
          command -v podman
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - run: just linux-image pulsebeam-linux-${{ github.sha }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with: {name: '${{ matrix.flavor }}-linux-x86_64', path: dist}
      - name: Run runtime tests
        run: just linux-run pulsebeam-linux-${{ github.sha }} just _runtime-test '${{ matrix.flavor }}' linux-x86_64 'dist/webrtc-${{ matrix.flavor }}-linux-x86_64.tar.gz'
  non-linux-desktop-runtime:
    name: Runtime (${{ matrix.flavor }}, ${{ matrix.target }})
    needs: non-linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {flavor: core, target: windows-x86_64, runner: windows-2025}
          - {flavor: native, target: windows-x86_64, runner: windows-2025}
          - {flavor: core, target: macos-x86_64, runner: macos-15-intel}
          - {flavor: native, target: macos-x86_64, runner: macos-15-intel}
          - {flavor: core, target: macos-arm64, runner: macos-15}
          - {flavor: native, target: macos-arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with: {just-version: 1.43.1}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with: {name: '${{ matrix.flavor }}-${{ matrix.target }}', path: dist}
      - name: Prime pinned Rust dependencies
        run: cargo fetch --locked
      - name: Run runtime tests
        run: just _runtime-test '${{ matrix.flavor }}' '${{ matrix.target }}' 'dist/webrtc-${{ matrix.flavor }}-${{ matrix.target }}.tar.gz'
  lifetime-sanitizers:
    name: ASan tests (${{ matrix.flavor }}, linux-x86_64)
    strategy: {fail-fast: false, matrix: {flavor: [core, native]}}
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    env: {PULSEBEAM_WEBRTC_SANITIZER: address, ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with: {just-version: 1.43.1}
      - name: Prove rootless Podman is available
        run: |
          command -v podman
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - run: just linux-image pulsebeam-linux-${{ github.sha }}
      - name: Build ASan artifact
        run: just linux-run pulsebeam-linux-${{ github.sha }} just build '${{ matrix.flavor }}' linux-x86_64
      - name: Run ASan tests
        run: just linux-run pulsebeam-linux-${{ github.sha }} just _runtime-test '${{ matrix.flavor }}' linux-x86_64 'dist/webrtc-${{ matrix.flavor }}-linux-x86_64.tar.gz'
  complete-audit:
    name: Audit complete matrix
    needs: [linux-build, non-linux-build]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with: {path: release, merge-multiple: true}
      - name: Audit artifacts
        run: |
          find release -maxdepth 1 -name 'webrtc-*.tar.gz' -printf '%f\n' | LC_ALL=C sort | xargs -r -I{} sha256sum "release/{}" > release/SHA256SUMS
          python3 -m tools.audit_release --scope complete --archives release --checksums release/SHA256SUMS --output release/RELEASE-MANIFEST.json
  complete-matrix-qualification:
    name: Complete-matrix qualification
    needs: [linux-build, non-linux-build, linux-desktop-runtime, non-linux-desktop-runtime, lifetime-sanitizers, complete-audit]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - name: Require all matrix checks to pass
        run: |
          for result in '${{ needs.linux-build.result }}' '${{ needs.non-linux-build.result }}' '${{ needs.linux-desktop-runtime.result }}' '${{ needs.non-linux-desktop-runtime.result }}' '${{ needs.lifetime-sanitizers.result }}' '${{ needs.complete-audit.result }}'; do test "$result" = success || exit 1; done
