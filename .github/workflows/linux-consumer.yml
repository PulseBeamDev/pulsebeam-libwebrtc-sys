name: Linux released consumer proof

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character lowercase Git revision to prove as a released consumer
        required: true
        type: string

permissions:
  contents: read

jobs:
  released-consumer:
    name: Released Rust consumer (${{ matrix.flavor }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: core
            target: linux-x86_64
            runner: ubuntu-24.04
          - flavor: native
            target: linux-x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: 1.43.1
      - name: Validate the exact requested revision
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
        run: '[[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - name: Prove rootless Podman is available
        shell: bash
        run: |
          command -v podman
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - name: Build the local native Linux image
        run: just linux-image pulsebeam-linux-${{ inputs.revision }}
      - name: Prove the released Rust-only consumer from a fresh cache
        run: >-
          just linux-run pulsebeam-linux-${{ inputs.revision }} python3 -m tools.rust_only_consumer released
          --repository https://github.com/PulseBeamDev/pulsebeam-libwebrtc-sys.git
          --revision '${{ inputs.revision }}' --target '${{ matrix.target }}' --flavor '${{ matrix.flavor }}'

  linux-consumer:
    needs: released-consumer
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every released consumer coordinate to succeed
        shell: bash
        run: |
          results=(
            "released-consumer=${{ needs.released-consumer.result }}"
          )
          printf '%s\n' "${results[@]}"
          for result in "${results[@]}"; do test "${result#*=}" = success || exit 1; done
