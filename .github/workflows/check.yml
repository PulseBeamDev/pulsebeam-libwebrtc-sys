name: Fast checks

on:
  pull_request:
  push:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_HOME: ${{ github.workspace }}/.work/cargo-home
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: 1.43.1
      - name: Prime pinned Rust dependencies
        run: cargo fetch --locked
      - name: Run fast offline checks
        run: just check
